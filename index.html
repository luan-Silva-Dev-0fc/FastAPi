<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CineLink - Mensagens</title>
    <style>
      body {
        font-family: sans-serif;
        background: #121212;
        color: white;
        display: flex;
        justify-content: center;
        padding: 50px;
      }
      .container {
        width: 100%;
        max-width: 400px;
        background: #1e1e1e;
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
      }
      h2 {
        text-align: center;
        color: #00dbde;
      }
      .input-group {
        display: flex;
        gap: 10px;
        margin-bottom: 20px;
      }
      input {
        flex: 1;
        padding: 10px;
        border-radius: 4px;
        border: none;
        outline: none;
      }
      button {
        padding: 10px;
        cursor: pointer;
        border: none;
        border-radius: 4px;
        background: #00dbde;
        color: #000;
        font-weight: bold;
      }
      button:hover {
        background: #fc00ff;
        color: white;
      }
      .lista {
        list-style: none;
        padding: 0;
      }
      .item {
        background: #2c2c2c;
        padding: 10px;
        margin-bottom: 10px;
        border-radius: 4px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-left: 4px solid #00dbde;
      }
      .btn-del {
        background: #ff4b2b;
        color: white;
        padding: 5px 10px;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h2>CineLink Mensagens</h2>

      <div class="input-group">
        <input type="text" id="msgInput" placeholder="Digite sua mensagem..." />
        <button onclick="enviarMensagem()">Enviar</button>
      </div>

      <ul id="listaMensagens" class="lista"></ul>
    </div>

    <script>
      const API_URL = "http://127.0.0.1:8000/mensagens";

      async function carregarMensagens() {
        const res = await fetch(API_URL);
        const mensagens = await res.json();
        const lista = document.getElementById("listaMensagens");
        lista.innerHTML = "";

        mensagens.forEach((m) => {
          lista.innerHTML += `
                <li class="item">
                    ${m.conteudo}
                    <button class="btn-del" onclick="deletarMensagem(${m.id})">X</button>
                </li>
            `;
        });
      }

      async function enviarMensagem() {
        const input = document.getElementById("msgInput");
        if (!input.value) return;

        await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ conteudo: input.value }),
        });

        input.value = "";
        carregarMensagens();
      }

      async function deletarMensagem(id) {
        await fetch(`${API_URL}/${id}`, { method: "DELETE" });
        carregarMensagens();
      }

      carregarMensagens();
    </script>
  </body>
</html>
